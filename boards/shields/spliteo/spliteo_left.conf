# NOTE: Zephyr only applies "<shield>.conf" for the exact shield name, so
# spliteo.conf is never read by the build. Shared settings must live here
# and in spliteo_right.conf.

CONFIG_ZMK_KEYBOARD_NAME="Spliteo Slim"

# BLE stability / range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- TEMPORARY: BLE pairing diagnostics, remove once pairing works ---
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
